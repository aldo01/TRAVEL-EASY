apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------- PROD environment ----------------------------
namespace: travel-easy-prod

resources:
  - namespace.yaml
  - ../../base

# Prod image tags. CI overrides these with an immutable tag (git SHA / version)
# via `kustomize edit set image ...`.
images:
  - name: travel-easy/auth-service
    newTag: prod
  - name: travel-easy/location-service
    newTag: prod
  - name: travel-easy/booking-service
    newTag: prod
  - name: travel-easy/review-service
    newTag: prod
  - name: travel-easy/notification-service
    newTag: prod
  - name: travel-easy/gateway
    newTag: prod

# Scale stateless services out in prod (databases stay single-replica).
replicas:
  - name: auth-service
    count: 2
  - name: location-service
    count: 2
  - name: booking-service
    count: 2
  - name: review-service
    count: 2
  - name: notification-service
    count: 2
  - name: gateway
    count: 2

patches:
  - path: configmap-patch.yaml
  - path: secret-patch.yaml
  # Apply resource requests/limits to every Deployment's main container.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
