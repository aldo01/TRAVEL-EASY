apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: location-service }
  template:
    metadata:
      labels: { app: location-service }
    spec:
      initContainers:
        - name: migrate
          image: travel-easy/location-service
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc", "./migrate && ./seed"]
          env:
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: DB_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@location-db:5432/location?sslmode=disable"
      containers:
        - name: location-service
          image: travel-easy/location-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: DB_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@location-db:5432/location?sslmode=disable"
            - name: NATS_URL
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: NATS_URL } }
            - name: GIN_MODE
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: GIN_MODE } }
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
spec:
  selector: { app: location-service }
  ports:
    - port: 8002
      targetPort: 8002
