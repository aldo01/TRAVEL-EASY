name: Reusable build & deploy

# Reusable pipeline: builds+pushes all service images to GHCR, then deploys the
# given Kustomize overlay. Called by cd-dev.yml and cd-prod.yml.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (dev|prod) — gates/approvals apply
        required: true
        type: string
      overlay:
        description: Kustomize overlay directory under k8s/overlays
        required: true
        type: string
      tag:
        description: Moving image tag (dev|prod)
        required: true
        type: string
      namespace:
        description: Target namespace
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        description: base64-encoded kubeconfig for the target cluster
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/travel-easy

jobs:
  build-push:
    name: Build & push · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: services/gateway }
          - { name: auth-service, context: services/auth-service }
          - { name: location-service, context: services/location-service }
          - { name: booking-service, context: services/booking-service }
          - { name: review-service, context: services/review-service }
          - { name: notification-service, context: notification-service }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ inputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ inputs.tag }}-${{ github.sha }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
      - name: Configure kubeconfig
        env:
          KC: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KC" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KC" | base64 -d > "$HOME/.kube/config"
            echo "HAS_KUBE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KUBE=false" >> "$GITHUB_ENV"
            echo "::warning::KUBE_CONFIG secret not set for ${{ inputs.environment }} — skipping cluster apply. Images were still built & pushed."
          fi
      - name: Pin images & apply
        if: env.HAS_KUBE == 'true'
        env:
          TAG: ${{ inputs.tag }}-${{ github.sha }}
        run: |
          cd k8s/overlays/${{ inputs.overlay }}
          for s in gateway auth-service location-service booking-service review-service notification-service; do
            kustomize edit set image travel-easy/$s=${IMAGE_PREFIX}-$s:${TAG}
          done
          kubectl apply -k .
      - name: Wait for rollout
        if: env.HAS_KUBE == 'true'
        run: |
          for s in gateway auth-service location-service booking-service review-service notification-service; do
            kubectl -n ${{ inputs.namespace }} rollout status deploy/$s --timeout=180s
          done
