apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: travel-easy/notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: NATS_URL
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: NATS_URL } }
            - name: GIN_MODE
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: GIN_MODE } }
            # Email/SMS secrets
            - name: BREVO_API_KEY
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: BREVO_API_KEY } }
            - name: BREVO_SENDER_EMAIL
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: BREVO_SENDER_EMAIL } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: RESEND_API_KEY } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: SMTP_PASS } }
            # Email/SMS non-secret config
            - name: BREVO_SENDER_NAME
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: BREVO_SENDER_NAME } }
            - name: BREVO_SMS_SENDER
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: BREVO_SMS_SENDER } }
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: SMTP_PORT } }
            - name: SMTP_FROM
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: SMTP_FROM } }
            - name: RESEND_FROM
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: RESEND_FROM } }
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports:
    - port: 8090
      targetPort: 8090
