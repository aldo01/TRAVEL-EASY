# ---------------------------------------------------------------------------
# ALL SECRETS LIVE HERE (and only here).
#
# This is a Kubernetes Secret. Each entry under `stringData` is one secret,
# exactly the "SECRET_NAME: SECRET_VALUE" model:
#
#   stringData:
#     AWS_KEY: "32937r8378378"     # SECRET_NAME: AWS_KEY, SECRET_VALUE: 32937r8378378
#
# Deployments reference these by name via `secretKeyRef` / `envFrom.secretRef`,
# so no secret value is ever hardcoded in application code or in the Deployment
# specs. Replace the placeholder values below before applying to a real cluster.
#
# NOTE: For production, do NOT commit real values. Use a sealed-secrets / SOPS /
# external-secrets workflow and keep this file as the template.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: travel-easy-secrets
type: Opaque
stringData:
  # --- Database ---
  DB_PASSWORD: "postgres"

  # --- Auth / JWT ---
  JWT_SECRET: "change-me-in-production"

  # --- Email + SMS (Brevo) ---
  BREVO_API_KEY: ""
  BREVO_SENDER_EMAIL: ""

  # --- Email fallbacks (optional) ---
  RESEND_API_KEY: ""
  SMTP_USER: ""
  SMTP_PASS: ""
