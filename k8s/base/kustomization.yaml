apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared manifests. Namespace, image tags, replicas and env-specific config
# are set by the dev/ and prod/ overlays.
resources:
  - secret.yaml
  - configmap.yaml
  - infra.yaml
  - auth-service.yaml
  - location-service.yaml
  - booking-service.yaml
  - review-service.yaml
  - notification-service.yaml
  - gateway.yaml
