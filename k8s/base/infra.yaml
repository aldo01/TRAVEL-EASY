# ---------------------------------------------------------------------------
# NATS message broker
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js"]
          ports:
            - containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  ports:
    - port: 4222
      targetPort: 4222
---
# ---------------------------------------------------------------------------
# Per-service PostgreSQL databases (database-per-service isolation)
# A reusable pattern: PVC + Deployment + Service for each database.
# ---------------------------------------------------------------------------
# auth-db
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: auth-db }
  template:
    metadata:
      labels: { app: auth-db }
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: travel-easy-config, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: travel-easy-secrets, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              value: "auth"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: auth-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector: { app: auth-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
